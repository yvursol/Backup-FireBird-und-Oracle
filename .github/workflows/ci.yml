name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser

      - name: Analyze
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Include *.ps1, *.psm1 -Recurse |
              Where-Object FullName -notmatch '[\\/]tests[\\/]'
          $results = $files | ForEach-Object {
              Invoke-ScriptAnalyzer -Path $_.FullName -Settings ./PSScriptAnalyzerSettings.psd1
          }
          if ($results) {
              $results | Format-Table Severity, RuleName, ScriptName, Line, Message -AutoSize -Wrap
              exit 1
          }
          Write-Output "No findings in $($files.Count) files"

  test:
    name: Pester (${{ matrix.shell == 'powershell' && 'Windows PowerShell 5.1' || 'PowerShell 7' }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester 5
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -SkipPublisherCheck -Force

      - name: Run tests
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'testResults.xml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shell }}
          path: testResults.xml
